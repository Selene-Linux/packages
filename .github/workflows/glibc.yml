name: glibc

on: workflow_dispatch

jobs:
  glibc:
    runs-on: ubuntu-latest
    
    steps:
        - name: dependencies
          run: |
           sudo apt-get update
           sudo apt-get install -y \
           gawk \
           bison \
           make \
           texinfo \
           python3

        - name: clone glibc
          run: |
           git clone --depth 1 https://sourceware.org/git/glibc.git

        - name: configure glibc
          run: |
           mkdir build
           cd build

           ../glibc/configure --prefix=/usr --disable-werror

        - name: build glibc
          run: |
           cd build
           make -j$(nproc)
           
        - name: clean up
          run: |
           cd build 
           find . -type f -exec mv -n -t x86_64-linux-gnu {} +
           find . -mindepth 1 -type d -empty -delete 
           
        - name: upload
          uses: actions/upload-artifact@v4
          with:
           name: glibc
           path: build

