name: glibc

on: [push, pull_request]

jobs:
  glibc:
    runs-on: ubuntu-latest
    
    steps:
       - name: dependencies
         run: |
          sudo apt-get update
          sudo apt-get install -y \
          gawk \
          bison \
          make \
          texinfo \
          python3

       - name: clone glibc
        run: |
         git clone --depth 1 https://sourceware.org/git/glibc.git

       - name: configure glibc
         run: |
          mkdir build
          cd build

          ../glibc/configure

       - name: build glibc
         run: |
           cd glibc-build
           make -j$(nproc)
        
       - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: glibc
          path: |
            glibc-build/**/*.so*
            glibc-build/libc.a

