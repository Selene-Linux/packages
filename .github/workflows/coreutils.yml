name: coreutils

on: workflow_dispatch

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            autopoint \
            bison \
            gperf \
            gettext \
            texinfo \
            rsync \
            wget \
            git \
            perl \
            m4

      - name: clone coreutils
        run: |
          git clone https://github.com/coreutils/coreutils.git
          git clone https://github.com/coreutils/gnulib.git
          cd coreutils
          ./bootstrap --gnulib-srcdir=../gnulib

      - name: configure
        run: |
          cd coreutils
          mkdir build
          cd build
          ../configure --prefix=/usr
      
      - name: build
        run: |
          cd coreutils/build
          make -j"$(nproc)"
          make install DESTDIR="$GITHUB_WORKSPACE/install"
          
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: install/
